name: Offline proctoring fixtures
on:
  pull_request:
    paths:
      - ml/proctoring/**
      - .github/workflows/proctoring-fixtures.yml
permissions:
  contents: read
jobs:
  synthetic-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ml/proctoring/requirements.txt
      - run: python -m unittest ml.proctoring.test_detect -v
