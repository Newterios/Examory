# Examory API gateway (nginx-unprivileged, runs as uid 101, read-only rootfs).
#   /api/auth/*     -> auth:8080/*     (e.g. /api/auth/v1/auth/login)
#   /api/quizzes/*  -> quizzes:8080/*  (e.g. /api/quizzes/v1/quizzes)
#   /api/grading/*  -> grading:8080/*  (e.g. /api/grading/v1/risks)
# TLS termination is not configured for local development (see NFR-4 note in
# services/auth/README.md); add a 443 server with certificates for staging.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    # $uri (not $request_uri): query strings are never logged.
    access_log /dev/stdout json;

    server_tokens off;
    sendfile off;
    keepalive_timeout 30s;

    # Request limits.
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Rate-limit zones (per client IP). Services apply their own finer limits
    # (per account, per subject) in Redis; these protect against floods.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=quiz_api:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Service addresses are re-resolved at run time (nginx >= 1.27.3: `resolve`
    # needs a shared-memory zone and a resolver). Without this nginx keeps the
    # IP it saw at start-up, and a service container that is recreated later
    # (redeploy, `make m4`) is no longer reached; its old address may even be
    # reused by another service. 127.0.0.11 is Docker's embedded DNS; set the
    # cluster resolver here when the gateway runs elsewhere.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream auth_upstream    { zone auth_upstream 64k;    server auth:8080 resolve;    keepalive 16; }
    upstream files_upstream { zone files_upstream 64k; server files:8080 resolve; keepalive 16; }
    upstream courses_upstream { zone courses_upstream 64k; server courses:8080 resolve; keepalive 16; }
    upstream quizzes_upstream { zone quizzes_upstream 64k; server quizzes:8080 resolve; keepalive 16; }
    upstream grading_upstream { zone grading_upstream 64k; server grading:8080 resolve; keepalive 16; }

    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
        default                   $request_id;
    }

    server {
        listen 8080 default_server;
        server_name _;
        limit_conn perip 50;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        # Overwrite (not append) so clients cannot inject a forged chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        # Research-replay headers are never accepted from the public edge.
        proxy_set_header X-Sim-Time "";
        proxy_set_header X-Act-As-User "";
        proxy_set_header X-Act-As-Group "";

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /api/auth/v1/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://auth_upstream/v1/auth/login;
            proxy_cookie_path /v1/auth /api/auth/v1/auth;
        }

        location /api/auth/ {
            limit_req zone=auth_api burst=20 nodelay;
            proxy_pass http://auth_upstream/;
            # The refresh cookie is issued with Path=/v1/auth by the service.
            proxy_cookie_path /v1/auth /api/auth/v1/auth;
        }

        location /api/files/v1/ {
            limit_req zone=auth_api burst=20 nodelay;
            proxy_pass http://files_upstream/v1/;
        }

        location /api/courses/v1/ {
            limit_req zone=auth_api burst=20 nodelay;
            proxy_pass http://courses_upstream/v1/;
        }

        location /api/quizzes/ {
            limit_req zone=quiz_api burst=60 nodelay;
            proxy_pass http://quizzes_upstream/;
        }

        location /api/grading/ {
            limit_req zone=auth_api burst=20 nodelay;
            proxy_pass http://grading_upstream/;
        }

        # Internal endpoints are not exposed through the gateway.
        location ~ ^/api/(auth|quizzes|grading)/(healthz|readyz)$ { return 404; }

        location / {
            default_type application/problem+json;
            return 404 '{"type":"urn:examory:problem:not_found","title":"Not Found","status":404,"code":"not_found"}';
        }
    }
}
